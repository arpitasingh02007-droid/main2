
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Events - Registration</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h2>Campus Event Management</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="events.html">Events</a>
            <a href="register.html">Registration</a>
        </nav>
    </header>

    <main class="container">
        <h1 id="registrationHeading">Student Registration</h1>

        <button onclick="changeFontSize()">Change Heading Size</button>
        <button onclick="toggleForm()">Show / Hide Form</button>

        <section id="registrationForm" class="form-section">
            <form id="studentForm" onsubmit="registerStudent(event)">

                <label for="studentName">Student Name:</label>
                <input type="text" id="studentName"
                       placeholder="Enter your name" required>

                <label for="rollNumber">Student Roll Number:</label>
                <input type="text" id="rollNumber"
                       placeholder="Enter your roll number" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email"
                       placeholder="Enter your email" required>

                <label for="eventSelection">Select Event:</label>
                <select id="eventSelection" required>
                    <option value="">-- Select an Event --</option>
                    <option value="Tech Fest">Tech Fest</option>
                    <option value="Music Festival">Music Festival</option>
                    <option value="Sports Day">Sports Day</option>
                    <option value="Art Competition">Art Competition</option>
                </select>

                <button type="submit">Register</button>
            </form>
        </section>

        <p id="registrationMessage"></p>
    </main>

    <footer>
        <p>Campus Event Management | College Project</p>
    </footer>

</body>
</html>
